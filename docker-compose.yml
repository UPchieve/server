x-pg-version: &pg-version "15.17"
x-pg-image: &pg-image postgres:15.17
x-pg-command: &pg-command postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all

x-pg-env: &pg-env
    POSTGRES_DB: upchieve
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: Password123

x-pg-healthcheck: &pg-healthcheck
    test: ["CMD", "pg_isready", "-h", "postgres"]
    interval: 3s
    timeout: 30s
    retries: 5
    start_period: 2s

# SQL files mounted to entrypoint folder are run in alphabetical order.
x-pg-initdb-volumes: &pg-initdb-volumes
    - ./database/db_init/schema.sql:/docker-entrypoint-initdb.d/a.sql
    - ./database/db_init/auth.sql:/docker-entrypoint-initdb.d/b.sql
    - ./database/db_init/local_auth.sql:/docker-entrypoint-initdb.d/c.sql
    - ./database/db_init/test_seeds.sql:/docker-entrypoint-initdb.d/d.sql
    - ./database/db_init/seed_migrations.sql:/docker-entrypoint-initdb.d/e.sql

x-graffiti: &graffiti
    build: https://gitlab.com/upchieve/graffiti.git#main
    # The image's entrypoint runs graffiti under `doppler run`, which needs a Doppler token this container doesn't have.
    entrypoint: ["/usr/local/bin/graffiti"]

x-graffiti-env: &graffiti-env
    # New Relic's agent won't start without a 40-character key. New Relic rejects this one.
    NEW_RELIC_LICENSE_KEY: "0000000000000000000000000000000000000000"

services:
    postgres:
        profiles: ["dev"]
        hostname: postgres
        ports:
            - "5432:5432"
        image: *pg-image
        environment: *pg-env
        command: *pg-command
        volumes: *pg-initdb-volumes
        healthcheck: *pg-healthcheck
    redis:
        profiles: ["dev"]
        hostname: redis
        ports:
            - "6379:6379"
        image: valkey/valkey:8.1.9
        command: valkey-server --notify-keyspace-events Ex
        volumes:
            - ./redis-volume:/data
    graffiti:
        <<: *graffiti
        profiles: ["dev"]
        environment:
            <<: *graffiti-env
            SUBWAY_REDIS_HOST: redis
        ports:
            - "4545:4545"
        depends_on:
            - redis
    pgadmin:
        profiles: ["dev"]
        image: dpage/pgadmin4
        depends_on:
            - postgres
        entrypoint: >
            /bin/sh -c "
            mkdir -m 700 /var/lib/pgadmin/storage/admin_upchieve.org;
            chown -R pgadmin:pgadmin /var/lib/pgadmin/storage/admin_upchieve.org;
            cp -prv /pgpassfile /var/lib/pgadmin/storage/admin_upchieve.org/;
            chmod 600 /var/lib/pgadmin/storage/admin_upchieve.org/pgpassfile;
            /entrypoint.sh
            "
        ports:
            - "80:80"
        environment:
            - PGADMIN_DEFAULT_EMAIL=admin@upchieve.org
            - PGADMIN_DEFAULT_PASSWORD=Password123
        volumes:
            - ./pgadmin/pgpassfile:/pgpassfile
            - ./pgadmin/servers.json:/pgadmin4/servers.json
        restart: unless-stopped
    postgres-anon:
        profiles: ["anon"]
        container_name: postgres-anon
        hostname: postgres
        build:
            dockerfile: database/privacy/masking/Dockerfile-local-anon
            args:
                PG_VERSION: *pg-version
        ports:
            - "6543:5432"
        environment: *pg-env
        volumes:
            - ./database/db_init/schema.sql:/docker-entrypoint-initdb.d/a.sql
            - ./database/db_init/auth.sql:/docker-entrypoint-initdb.d/b.sql
            - ./database/db_init/local_auth.sql:/docker-entrypoint-initdb.d/c.sql
            - ./database/db_init/test_seeds.sql:/docker-entrypoint-initdb.d/d.sql
            - ./database/db_init/seed_migrations.sql:/docker-entrypoint-initdb.d/e.sql
            - ./database/db_init/local_anon.sql:/docker-entrypoint-initdb.d/f.sql
        healthcheck: *pg-healthcheck
    postgres-e2e:
        profiles: ["e2e"]
        container_name: postgres-e2e
        hostname: postgres
        ports:
            - "5500:5432"
        image: *pg-image
        environment: *pg-env
        command: *pg-command
        volumes: *pg-initdb-volumes
        healthcheck: *pg-healthcheck
    redis-e2e:
        profiles: ["e2e"]
        container_name: redis-e2e
        hostname: redis
        command: redis-server --notify-keyspace-events Ex
        ports:
            - "5501:6379"
        image: valkey/valkey:8.1.9
    graffiti-e2e:
        <<: *graffiti
        profiles: ["e2e"]
        container_name: graffiti-e2e
        environment:
            <<: *graffiti-env
            SUBWAY_REDIS_HOST: redis-e2e
        ports:
            - "5503:4545"
        depends_on:
            - redis-e2e
    database-ci:
        profiles: ["db-test"]
        image: *pg-image
        hostname: postgres
        ports:
            - "${DB_PORT:-5502}:5432"
        environment: *pg-env
        volumes:
            - ./database/db_init/schema.sql:/docker-entrypoint-initdb.d/a.sql
            - ./database/db_init/test_seeds.sql:/docker-entrypoint-initdb.d/d.sql
            - ./database/db_init/seed_migrations.sql:/docker-entrypoint-initdb.d/e.sql
        healthcheck: *pg-healthcheck
